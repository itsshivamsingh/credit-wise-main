<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - CreditWise</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>CreditWise</h1>
        <p>Create Your Account</p>
      </div>

      <form id="registerForm" class="auth-form">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input 
            type="text" 
            id="fullName" 
            name="fullName" 
            placeholder="John Doe" 
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="you@example.com" 
            required
          >
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input 
            type="tel" 
            id="phone" 
            name="phone" 
            placeholder="1234567890" 
            pattern="\d{10}" 
            required
          >
          <small>Enter a 10-digit phone number</small>
        </div>

        <div class="form-group">
          <label for="employment">Employment Status</label>
          <select id="employment" name="employment">
            <option value="Employed">Employed</option>
            <option value="Self-Employed">Self-Employed</option>
            <option value="Unemployed">Unemployed</option>
            <option value="Student">Student</option>
          </select>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="••••••••" 
            minlength="6"
            required
          >
          <small>Minimum 6 characters</small>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input 
            type="password" 
            id="confirmPassword" 
            name="confirmPassword" 
            placeholder="••••••••" 
            required
          >
        </div>

        <button type="submit" class="btn-primary btn-block">Create Account</button>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="login.html">Sign in</a></p>
      </div>

      <div id="successMessage" class="success-message" style="display: none;"></div>
      <div id="errorMessage" class="error-message-box" style="display: none;"></div>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const fullName = document.getElementById('fullName').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const employment = document.getElementById('employment').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      const errorDiv = document.getElementById('errorMessage');
      const successDiv = document.getElementById('successMessage');

      try {
        const response = await fetch('http://localhost:5001/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fullName,
            email,
            phone,
            employment,
            password,
            confirmPassword
          })
        });

        const data = await response.json();

        if (!response.ok) {
          errorDiv.textContent = data.message || 'Registration failed';
          errorDiv.style.display = 'block';
          successDiv.style.display = 'none';
          return;
        }

        // Save token and user info
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));

        successDiv.textContent = 'Account created successfully! Redirecting to dashboard...';
        successDiv.style.display = 'block';
        errorDiv.style.display = 'none';

        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1500);
      } catch (error) {
        errorDiv.textContent = 'Connection error. Please try again.';
        errorDiv.style.display = 'block';
        successDiv.style.display = 'none';
      }
    });
  </script>
</body>
</html>
